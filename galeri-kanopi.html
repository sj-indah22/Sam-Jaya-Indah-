<style>
/* ==== COPY STYLE SAMA DARI PROYEK === */
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background-image: url('assets/background-hero.png');
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: scroll;
    background-position: top;
    color: white;
}
section { padding: 100px 30px; }
h1, h2, h3 { margin: 0 0 15px; }
a { text-decoration: none; color: white; }

/* ==== NAVBAR ==== */
.navbar {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 40px;
    position: fixed;
    top: 0;
    z-index: 999;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(6px);
    box-sizing: border-box;
}

/* kiri */
.navbar-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.navbar-logo {
    width: 40px;
    height: auto;
}

.logo {
    font-size: 20px;
    font-weight: 700;
    color: white;
}

/* menu kanan desktop */
.nav-links {
    display: flex;
    gap: 25px;
    align-items: center;
}

.nav-links a {
    color: white;
    transition: 0.2s;
}

.nav-links a:hover,
.nav-links a.active {
    color: #ff4747;
}

/* Burger & Mobile Nav */
.burger {
    display: none;
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 100000;
    font-size: 30px;
    cursor: pointer;
}

/* tampilkan X saat aktif */
.burger.active {
  font-size: 36px;
  transform: rotate(0deg);
}

/* Mobile nav */
.mobile-nav {
    position: fixed;
    top: 0;
    right: -300px;
    width: 250px;
    height: 100vh;
    background: rgba(0,0,0,0.92);
    padding: 80px 20px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    transition: 0.3s ease;
    z-index: 9999;
}

.mobile-close {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 36px;
    cursor: pointer;
    color: white;
}


.mobile-nav.show {
    right: 0;
}

.mobile-nav a {
    color: white;
    font-size: 18px;
}

/* Active link style */
.nav-links a.active,
.mobile-nav a.active {
    color: #ff4747;
}

/* Responsive */
@media (max-width: 900px) {
    .nav-links { display: none; }
    .burger { display: block; }
}

/* HERO */
.hero { padding:130px 0 40px; text-align:center; }
.hero h1 { font-size:60px; color:#ff4747; text-shadow:5px 5px 10px black; }

.content-wrap h2 {
    display: inline-block;
    background: #c20000;   /* warna merah */
    color: #fff;
    padding: 8px 18px;
    border-radius: 8px;   /* biar jadi shape */
    font-weight: 700;

      /* jarak samping */
    margin-left: 20px;
    margin-right: 20px;
    
}


@media (max-width: 600px) {

    .hero h1 { font-size:40px; color:#ff4747; text-shadow:5px 5px 10px black; }
    .content-wrap h2 {
        font-size:15px;
        margin-left: auto;
        margin-right: auto;
        display: inline-block;
    }
    
}


.single-photo {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 25px;
    padding: 20px;
}

.photo-item {
    background: rgba(243, 5, 5, 0.461);
    border-radius: 14px;   /* LENGKUNG */
    overflow: hidden;      /* wajib agar lengkungan foto tidak keluar */
}

/* FOTO */
.photo-item img {
    width: 100%;
    height: auto;          /* biar ukuran asli */
    object-fit: contain;   /* tidak crop */
    display: block;
    border-radius: 14px 14px 0 0; /* sudut atas tetap lengkung */
}

.caption-row {
    padding: 12px 14px;
    text-align: center;
    background: rgba(0,0,0,0.3);
}

.caption {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
}

/* MOBILE: jadi 1 kolom */
@media (max-width: 600px) {
    .single-photo {
        grid-template-columns: 1fr;
        gap: 15px;
    }

    .caption {
        font-size: 16px;
    }
}





/* ===== GALERI — DESKTOP (3 kolom fix) ===== */
.gallery-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr); /* 3 kolom fix */
    gap: 25px;
    padding: 20px;
}

.gallery-item {
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    overflow: hidden;
}

/* FOTO */
.gallery-item img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
}

/* CAPTION */
.caption-row {
    padding: 12px 14px;
    text-align: left; /* rata kiri */
}

.caption {
    font-size: 16px;
    margin: 0;
}

/* ===== MOBILE (2 kolom, teks kiri) ===== */
@media (max-width: 600px) {
    .gallery-container {
        grid-template-columns: repeat(2, 1fr); /* dari 3 → 2 kolom */
        gap: 12px;
    }

    .gallery-item img {
        height: 120px; /* proporsional */
    }

    .caption-row {
        padding: 8px 10px;
        text-align: left; /* tetap kiri */
    }

    .caption {
        font-size: 13px;
    }
}

/* Overlay Background */
.preview-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);

 <script>

/* --- element refs --- */
const burger = document.querySelector(".burger");
const mobileNav = document.querySelector(".mobile-nav");
const mobileClose = document.querySelector(".mobile-close");
const previewBox = document.getElementById("imgPreview");
const previewImg = document.getElementById("previewImg");
const closePreview = document.querySelector(".close-preview");

document.querySelectorAll(".gallery-item img, .previewable").forEach(img => {
    img.addEventListener("click", () => {
        previewImg.src = img.src;
        previewBox.style.display = "flex";
    });
});


closePreview.addEventListener("click", () => {
    previewBox.style.display = "none";
});

// Klik area gelap = tutup
previewBox.addEventListener("click", (e) => {
    if (e.target === previewBox) {
        previewBox.style.display = "none";
    }
});

/* safety */
if (burger && mobileNav) {

  /* toggle function */
  function openMobile() {
    mobileNav.classList.add("show");
    burger.classList.add("active");
    mobileNav.setAttribute("aria-hidden","false");
  }
  function closeMobile() {
    mobileNav.classList.remove("show");
    burger.classList.remove("active");
    mobileNav.setAttribute("aria-hidden","true");
  }

  /* click burger */
  burger.addEventListener("click", (e) => {
    e.stopPropagation(); // penting! jangan biarkan event jatuh ke document
    mobileNav.classList.toggle("show");
    burger.classList.toggle("active");
  });

  /* keyboard accessibility: Enter / Space */
  burger.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      burger.click();
    }
  });

  /* close button inside mobile */
  if (mobileClose) {
    mobileClose.addEventListener("click", (e) => {
      e.stopPropagation();
      closeMobile();
    });
  }

  /* close when a mobile link clicked */
  document.querySelectorAll(".mobile-nav a").forEach(a => {
    a.addEventListener("click", () => {
      closeMobile();
    });
  });

  /* click outside mobile menu -> close */
  document.addEventListener("click", (e) => {
    if (mobileNav.classList.contains("show") &&
        !mobileNav.contains(e.target) &&
        !burger.contains(e.target)) {
      closeMobile();
    }
  });

  /* ESC to close */
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && mobileNav.classList.contains("show")) {
      closeMobile();
    }
  });
}

/* --- active link highlighting (robust) --- */
(function markActive(){
  let path = window.location.pathname.split("/").pop().split("?")[0].split("#")[0];
  if (!path) path = "index.html";

  document.querySelectorAll(".nav-links a, .mobile-nav a").forEach(link=>{
    const href = (link.getAttribute("href") || "").split("?")[0].split("#")[0];
    if (href === path) {
      link.classList.add("active");
    } else {
      link.classList.remove("active");
    }
  });
})();
</script>
